[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false

# Dev-only build tasks for rig (run with `cargo xtask <task>`). This crate is
# never a dependency of the `rig` binary or `riglib`; it only builds when
# invoked explicitly. Keeping the Markdown -> ANSI help renderer here means
# `--help` does no rendering at run time; the output is committed to
# src/help-generated.in.

[dependencies]
# render the markdown help text (src/help/*.md) to the committed ANSI strings
# in src/help-generated.in
pulldown-cmark = { version = "0.12", default-features = false }
# build the committed shim R packages in src/data/rvenv-shim (gen-rvenv-shim)
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
