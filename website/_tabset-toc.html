<!--
Quarto turns the headings inside a `::: {.panel-tabset}` block into tab buttons,
and drops every heading inside the tabset from the on-page table of contents.
On the tutorial pages that hides all the steps, because the whole tutorial body
lives inside per-OS tabs.

This script rebuilds the right-hand TOC from the DOM: one entry for the active
tab (labelled with the tab's name, e.g. "macOS") plus the headings inside it,
in document order with everything else on the page. It re-runs when the reader
switches tabs, or when Quarto restores a remembered tab from localStorage on
`pageshow`.

It runs synchronously, before quarto.js installs its scroll handler, so the
initial TOC gets Quarto's own active-section highlighting; after a tab switch
the highlighting is maintained by the handler installed here.
-->
<script>
(function () {
  const toc = document.querySelector('nav#TOC');
  const main = document.querySelector('main');
  if (!toc || !main || !main.querySelector('.panel-tabset')) return;

  const tocDepth = 3;

  const headingText = (el) => {
    const clone = el.cloneNode(true);
    clone.querySelectorAll('.anchorjs-link, .anchor-link').forEach((a) => a.remove());
    return clone.textContent.trim();
  };

  // Flat, document-order list of { level, target, text }.
  const collect = (root, items) => {
    for (const child of root.children) {
      if (child.classList.contains('panel-tabset')) {
        const pane = child.querySelector('.tab-content > .tab-pane.active');
        const tab = child.querySelector('.nav-tabs .nav-link.active');
        if (!pane) continue;
        const inner = [];
        collect(pane, inner);
        if (tab && pane.id && inner.length) {
          items.push({
            level: inner[0].level - 1,
            target: '#' + pane.id,
            text: headingText(tab),
          });
        }
        items.push(...inner);
        continue;
      }
      if (/^H[1-6]$/.test(child.tagName)) {
        const id = child.getAttribute('data-anchor-id') || child.id ||
          (child.parentElement && child.parentElement.id);
        if (id) {
          items.push({
            level: Number(child.tagName[1]),
            target: '#' + id,
            text: headingText(child),
          });
        }
        continue;
      }
      collect(child, items);
    }
  };

  const build = (items) => {
    const root = document.createElement('ul');
    const top = Math.min(...items.map((i) => i.level));
    const stack = [{ level: top, ul: root, lastLi: null }];
    for (const item of items) {
      if (item.level - top + 1 > tocDepth) continue;
      while (stack.length > 1 && item.level < stack[stack.length - 1].level) stack.pop();
      let frame = stack[stack.length - 1];
      if (item.level > frame.level) {
        let ul = frame.ul;
        if (frame.lastLi) {
          ul = document.createElement('ul');
          frame.lastLi.appendChild(ul);
        }
        frame = { level: item.level, ul: ul, lastLi: null };
        stack.push(frame);
      }
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = item.target;
      a.id = 'toc-' + item.target.slice(1);
      a.className = 'nav-link';
      a.setAttribute('data-scroll-target', item.target);
      a.textContent = item.text;
      li.appendChild(a);
      frame.ul.appendChild(li);
      frame.lastLi = li;
    }
    return root;
  };

  const render = () => {
    const items = [];
    collect(main, items);
    if (!items.length) return;
    const fresh = build(items);
    const old = toc.querySelector('ul');
    if (old) {
      old.replaceWith(fresh);
    } else {
      toc.appendChild(fresh);
    }
    highlight();
  };

  // Same rule as quarto.js: the last section whose top has scrolled past.
  const sectionMargin = 200;
  const highlight = () => {
    const links = Array.from(toc.querySelectorAll('a[data-scroll-target]'));
    if (!links.length) return;
    const sections = links.map((a) => document.getElementById(a.getAttribute('href').slice(1)));
    let current = 0;
    if (window.innerHeight + window.pageYOffset >= document.body.offsetHeight) {
      current = sections.length - 1;
    } else {
      for (let i = 0; i < sections.length; i++) {
        if (sections[i] && window.pageYOffset >= sections[i].offsetTop - sectionMargin) {
          current = i;
        }
      }
    }
    links.forEach((a, i) => a.classList.toggle('active', i === current));
  };

  render();

  // Quarto restores grouped tabsets on `pageshow` and toggles the tab classes
  // in a click handler, so re-render on the next tick, once those have run.
  const rerender = () => window.setTimeout(render, 0);
  window.addEventListener('pageshow', rerender);
  document.addEventListener('shown.bs.tab', rerender);
  document.addEventListener('click', (event) => {
    if (event.target.closest('.panel-tabset .nav-tabs .nav-link')) rerender();
  });
  document.addEventListener('DOMContentLoaded', () => {
    window.addEventListener('scroll', highlight, { passive: true });
  });
})();
</script>
