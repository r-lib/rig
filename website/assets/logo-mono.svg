<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="rig">
  <title>rig</title>

  <!-- Single-colour glyph for the macOS menu bar / favicons. No hex, no
       wordmark: neither survives at 16px. Same mark geometry as logo.svg,
       scaled from its bounding box (46..140, 36..142) into a 100x100 box.
       Cuts are slightly fatter than in logo.svg so they stay open at 16px. -->

  <defs>
    <mask id="rig-mono-cut">
      <rect x="0" y="0" width="200" height="200" fill="#fff"/>
      <ellipse cx="88" cy="74" rx="14" ry="12" fill="#000"/>
      <path d="M 62 90 L 134 100 L 134 116 L 62 106 Z" fill="#000"/>
      <path d="M 56 104 L 56 140 L 100 140 Z" fill="#000"/>
    </mask>
  </defs>

  <g transform="translate(-23.7,-20.5) scale(0.792)" color="inherit">
    <path d="M 66 48 L 108 58 Q 126 88 130 132 L 66 132 Z"
          fill="currentColor" mask="url(#rig-mono-cut)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <line x1="61" y1="40" x2="61" y2="138" stroke-width="13"/>
      <line x1="54" y1="137" x2="138" y2="137" stroke-width="11"/>
    </g>
  </g>
</svg>
