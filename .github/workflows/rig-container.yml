name: Build rig binary-only container

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron:  '55 7 * * *'

jobs:

  # ------------------------------------------------------------------------

  amd64:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64
        provenance: false
        context: containers/rig
        push: true
        load: true
        tags: ghcr.io/r-lib/rig/base-amd64:latest

    - name: Determine rig version and push versioned tag
      id: version
      run: |
        docker create --name extract --entrypoint /rig ghcr.io/r-lib/rig/base-amd64:latest
        docker cp extract:/rig ./rig
        docker rm extract
        chmod +x ./rig
        version="$(./rig --version | awk '{print $NF}')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        docker tag ghcr.io/r-lib/rig/base-amd64:latest "ghcr.io/r-lib/rig/base-amd64:$version"
        docker push "ghcr.io/r-lib/rig/base-amd64:$version"
      shell: bash

  arm64:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build
      uses: docker/build-push-action@v7
      with:
        platforms: linux/arm64
        provenance: false
        context: containers/rig
        push: true
        load: true
        tags: ghcr.io/r-lib/rig/base-arm64:latest

    - name: Determine rig version and push versioned tag
      id: version
      run: |
        docker create --name extract --entrypoint /rig ghcr.io/r-lib/rig/base-arm64:latest
        docker cp extract:/rig ./rig
        docker rm extract
        chmod +x ./rig
        version="$(./rig --version | awk '{print $NF}')"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        docker tag ghcr.io/r-lib/rig/base-arm64:latest "ghcr.io/r-lib/rig/base-arm64:$version"
        docker push "ghcr.io/r-lib/rig/base-arm64:$version"
      shell: bash

  # ------------------------------------------------------------------------

  manifest:
    needs: [ amd64, arm64 ]
    runs-on: ubuntu-latest
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - run: |
        docker buildx imagetools create -t ghcr.io/r-lib/rig/base:latest \
          ghcr.io/r-lib/rig/base-amd64:latest \
          ghcr.io/r-lib/rig/base-arm64:latest
        docker buildx imagetools create -t "ghcr.io/r-lib/rig/base:${{ needs.amd64.outputs.version }}" \
          "ghcr.io/r-lib/rig/base-amd64:${{ needs.amd64.outputs.version }}" \
          "ghcr.io/r-lib/rig/base-arm64:${{ needs.arm64.outputs.version }}"
      shell: bash
