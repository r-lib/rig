name: sign-windows.yaml

on:
  workflow_dispatch:
    inputs:
      signing-policy:
        description: 'SignPath signing policy'
        required: true
        default: 'test-signing'
        type: choice
        options:
          - test-signing
          - release-signing

env:
  RUST_BACKTRACE: 1

jobs:

  windows:
    runs-on: ${{ matrix.config.runner }}
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x86_64 (signed)
            runner: windows-2022
            arch: x86_64
          - name: Windows aarch64 (signed)
            runner: windows-11-arm
            arch: aarch64

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 10

    - name: Install rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install make
      run: choco install make

    - name: Install curl
      run: choco install curl

    # Round 1: sign the loose rig.exe / rig-shim.exe binaries themselves,
    # before they get baked into the installer and the user-mode zip. This
    # way both the installer and the zip (what `website/install.ps1`
    # downloads) end up carrying signed binaries.
    - run: |
        make target/release/rig.exe target/release/rig-shim.exe
      shell: bash

    # Upload the raw exes (not pre-zipped): actions/upload-artifact wraps
    # them in its own single zip, which is exactly the one zip level
    # SignPath's <zip-file><pe-file path="*.exe"> config expects. Zipping
    # them ourselves first would add a second zip layer and SignPath would
    # find 0 matching pe-files.
    - uses: actions/upload-artifact@v7
      id: upload-unsigned-bin-artifact
      with:
        name: rig-windows-${{ matrix.config.arch }}-unsigned-bin
        path: |
          target/release/rig.exe
          target/release/rig-shim.exe

    - uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 'ce0224dd-53d3-46e4-8e82-b71df4fcef90'
        project-slug: 'rig'
        artifact-configuration-slug: 'windows-binaries'
        signing-policy-slug: '${{ inputs.signing-policy }}'
        github-artifact-id: '${{ steps.upload-unsigned-bin-artifact.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: 'signed-bin'

    - name: Install signed binaries
      run: |
        unzip -o -j signed-bin/*.zip -d target/release
        touch target/release/rig.exe target/release/rig-shim.exe
      shell: bash

    # Round 2: build the installer (now embedding the signed exes) and the
    # user-mode zip (now containing the signed exes too), then sign the
    # installer itself.
    - run: |
        make win ARCH=${{ matrix.config.arch }}
      shell: bash

    - uses: actions/upload-artifact@v7
      id: upload-unsigned-artifact
      with:
        name: rig-windows-${{ matrix.config.arch }}-unsigned
        path: 'rig-*.exe'

    # The zip is what `website/install.ps1` downloads. Its rig.exe /
    # rig-shim.exe were already signed in round 1 above; upload it here so
    # that `tools/release-assets.sh` can take every Windows asset from one
    # run.
    - uses: actions/upload-artifact@v7
      with:
        name: rig-windows-${{ matrix.config.arch }}-zip
        path: 'rig-windows-*.zip'

    - uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 'ce0224dd-53d3-46e4-8e82-b71df4fcef90'
        project-slug: 'rig'
        artifact-configuration-slug: 'windows-installer'
        signing-policy-slug: '${{ inputs.signing-policy }}'
        github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: 'signed'

    - uses: actions/upload-artifact@v7
      with:
        name: rig-windows-${{ matrix.config.arch }}-signed
        path: 'signed/*'
